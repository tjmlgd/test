<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classes</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0e1117; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid #222; }
    main { max-width: 650px; margin: 5rem auto; text-align: center; width: 90%; }
    .search-box { display: flex; margin-top: 1.5rem; gap: 8px; }
    input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #161b22; color: #fff; font-size: 16px; outline: none; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #6366f1; color: #fff; font-weight: bold; cursor: pointer; }
    #viewport-container { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 9999; }
    .toolbar { height: 40px; background: #161b22; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; border-bottom: 1px solid #333; }
    iframe { flex: 1; border: none; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h3>Achroma</h3>
    <button onclick="window.location.replace('https://classroom.google.com')">Panic</button>
  </header>
  <main>
    <h1>Web Proxy</h1>
    <div class="search-box">
      <input type="text" id="url-input" placeholder="Search or type URL..." onkeydown="if(event.key==='Enter') launch()">
      <button onclick="launch()">Search</button>
    </div>
  </main>
  <div id="viewport-container">
    <div class="toolbar">
      <span>Proxied Viewport</span>
      <button onclick="closeFrame()">Close</button>
    </div>
    <iframe id="app-frame" allowfullscreen></iframe>
  </div>

  <script src="uv/uv.bundle.js"></script>
  <script src="uv/uv.config.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: __uv$config.prefix })
        .then(() => console.log('SW Registered'))
        .catch(console.error);
    }
    function launch() {
      let q = document.getElementById('url-input').value.trim();
      if (!q) return;
      let url = (q.startsWith('http://') || q.startsWith('https://')) ? q : 
                (q.includes('.') && !q.includes(' ') ? 'https://' + q : 'https://duckduckgo.com/?q=' + encodeURIComponent(q));
      document.getElementById('app-frame').src = __uv$config.prefix + __uv$config.encodeUrl(url);
      document.getElementById('viewport-container').style.display = 'flex';
    }
    function closeFrame() {
      document.getElementById('app-frame').src = 'about:blank';
      document.getElementById('viewport-container').style.display = 'none';
    }
  </script>
</body>
</html>
